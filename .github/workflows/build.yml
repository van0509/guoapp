name: Build app packages

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - run: dart analyze lib test integration_test test_driver

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Install Android NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;28.2.13676358"
      - name: Configure Android signing
        run: python scripts/configure_signing.py --edition ${{ matrix.edition }} ${{ github.event_name == 'push' && '--require' || '' }}
        env:
          ANDROID_HONGGUOJIAN_KEYSTORE_BASE64: ${{ secrets.ANDROID_HONGGUOJIAN_KEYSTORE_BASE64 }}
          ANDROID_HONGGUOJIAN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_HONGGUOJIAN_KEYSTORE_PASSWORD }}
          ANDROID_HONGGUOJIAN_KEY_ALIAS: ${{ secrets.ANDROID_HONGGUOJIAN_KEY_ALIAS }}
          ANDROID_HONGGUOJIAN_KEY_PASSWORD: ${{ secrets.ANDROID_HONGGUOJIAN_KEY_PASSWORD }}
          ANDROID_ZHENGUOJIAN_KEYSTORE_BASE64: ${{ secrets.ANDROID_ZHENGUOJIAN_KEYSTORE_BASE64 }}
          ANDROID_ZHENGUOJIAN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_ZHENGUOJIAN_KEYSTORE_PASSWORD }}
          ANDROID_ZHENGUOJIAN_KEY_ALIAS: ${{ secrets.ANDROID_ZHENGUOJIAN_KEY_ALIAS }}
          ANDROID_ZHENGUOJIAN_KEY_PASSWORD: ${{ secrets.ANDROID_ZHENGUOJIAN_KEY_PASSWORD }}
      - run: python scripts/build_android.py ${{ matrix.arguments }}
      - name: Verify APK signatures
        if: github.event_name == 'push'
        run: python scripts/apk_signature.py dist/android
      - name: Remove signing files
        if: always()
        run: python scripts/configure_signing.py --clean
      - name: Publish Android APK to GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(python3 -c "import re, pathlib; print(re.search(r'^version:\s*(\S+)', pathlib.Path('pubspec.yaml').read_text(encoding='utf-8'), re.M).group(1).split('+')[0])")
          TAG="v${VERSION}"
          gh release create "$TAG" --title "真果鉴 / 红果鉴 $TAG" --notes "真果鉴（全站源版）与红果鉴（单站源版）多端独立短剧应用安装包" || true
          gh release upload "$TAG" dist/android/* --clobber
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ matrix.edition }}-android
          path: dist/android/*
          if-no-files-found: ignore
          retention-days: 14
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Add MinGW64 to PATH
        run: echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: python scripts/build_windows.py ${{ matrix.arguments }}
      - name: Publish Windows packages to GitHub Release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(python -c "import re, pathlib; print(re.search(r'^version:\s*(\S+)', pathlib.Path('pubspec.yaml').read_text(encoding='utf-8'), re.M).group(1).split('+')[0])")
          TAG="v${VERSION}"
          gh release create "$TAG" --title "真果鉴 / 红果鉴 $TAG" --notes "真果鉴（全站源版）与红果鉴（单站源版）多端独立短剧应用安装包" || true
          gh release upload "$TAG" dist/windows/* --clobber
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ matrix.edition }}-windows
          path: dist/windows/*
          if-no-files-found: ignore
          retention-days: 14

  ios:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: python3 scripts/build_ios.py ${{ matrix.arguments }}
      - name: Publish iOS app to GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(python3 -c "import re, pathlib; print(re.search(r'^version:\s*(\S+)', pathlib.Path('pubspec.yaml').read_text(encoding='utf-8'), re.M).group(1).split('+')[0])")
          TAG="v${VERSION}"
          gh release create "$TAG" --title "真果鉴 / 红果鉴 $TAG" --notes "真果鉴（全站源版）与红果鉴（单站源版）多端独立短剧应用安装包" || true
          gh release upload "$TAG" dist/ios/* --clobber
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ matrix.edition }}-ios-unsigned
          path: dist/ios/*
          if-no-files-found: ignore
          retention-days: 14
